[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weixin-bot"
version = "0.1.0"
description = "通用 Python 微信机器人框架"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "weixinbot contributors" }]
keywords = ["weixin", "wechat", "bot", "agent", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pycryptodome>=3.20.0",
    "python-dotenv>=1.0.0",
    "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
silk = ["pilk>=0.2.0"]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
weixinbot = "weixin_bot.app:main"

[project.urls]
Repository = "https://github.com/user/weixinbot"

[tool.hatch.build.targets.wheel]
packages = ["src/weixin_bot"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
